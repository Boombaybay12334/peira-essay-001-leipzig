name: Reproduce export

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run export
      - run: git diff --exit-code exports/
